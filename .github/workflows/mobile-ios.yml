name: iOS app

# The iOS app is a thin Capacitor shell around the deployment's own site (docs/ark/19-mobile.md). The
# Xcode project is made from the deployment's names every time, so the parts that can break are the
# names and the build, and only a Mac can build.
#
#  - Every change to it makes the project against made-up names and builds it for the simulator
#    without signing. Holds no secret and answers "does this still build".
#  - A person starting it by hand archives and exports the signed app for App Store Connect, signing
#    with a key from the owner's Apple developer account. The .ipa is kept as a build artifact;
#    uploading it (to TestFlight and the store) is the owner's.
#
# Nothing here has been run on GitHub, and the project has never been compiled: this repository's
# build machine is Linux, where Capacitor makes the project (that part has been run) and Xcode does
# not exist. The first run of this workflow is the first build.
on:
  pull_request:
    paths:
      - "mobile/ios/**"
      - "mobile/scripts/**"
      - ".github/workflows/mobile-ios.yml"
  push:
    branches: [main]
    paths:
      - "mobile/ios/**"
      - "mobile/scripts/**"
      - ".github/workflows/mobile-ios.yml"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number for this upload. Must be higher than every one already in App Store Connect. Empty uses the run number."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Made-up names, on purpose: this proves the project builds, and must never be mistaken for the app.
  check:
    name: make and build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: mobile/ios
      - run: bun test mobile
      - name: Make the project against made-up names
        env:
          ARK_IOS_APP_ID: ABCDE12345.test.example.ark
          ARK_APP_URL: https://ark.example
          ARK_APP_NAME: Ark Test
          ARK_IOS_URL_SCHEME: arkapp
          ARK_IOS_BUILD_NUMBER: "1"
        run: bun mobile/scripts/prepare-ios.ts > "$RUNNER_TEMP/versions.txt"
      - name: Build for the simulator, unsigned
        run: |
          # macOS ships bash 3.2, which has no `mapfile`; read the file a line at a time instead.
          versions=()
          while IFS= read -r line; do versions+=("$line"); done < "$RUNNER_TEMP/versions.txt"
          xcodebuild build \
            -project mobile/ios/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            "${versions[@]}"

  # By hand only: it holds the signing key.
  release:
    name: signed app for App Store Connect
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-latest
    timeout-minutes: 40
    # The deployment's names and the signing key are only given to a run started by hand from a
    # branch the environment allows; add required reviewers to it (mobile/README.md).
    environment: mobile-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: mobile/ios
      - name: Make the project from the deployment's own names
        env:
          # Repository (or environment) variables, set by the owner: see mobile/README.md.
          ARK_IOS_APP_ID: ${{ vars.ARK_IOS_APP_ID }}
          ARK_APP_URL: ${{ vars.ARK_APP_URL }}
          ARK_APP_NAME: ${{ vars.ARK_APP_NAME }}
          ARK_IOS_URL_SCHEME: ${{ vars.ARK_IOS_URL_SCHEME }}
          ARK_IOS_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: bun mobile/scripts/prepare-ios.ts > "$RUNNER_TEMP/versions.txt"
      - name: Put the App Store Connect key where Xcode reads it
        env:
          ASC_KEY_BASE64: ${{ secrets.ARK_IOS_ASC_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive and export, signed by Xcode with the key
        env:
          ARK_IOS_APP_ID: ${{ vars.ARK_IOS_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ARK_IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ARK_IOS_ASC_ISSUER_ID }}
        run: |
          # The identifier was checked by the previous step: the team is what comes before the first dot.
          team="${ARK_IOS_APP_ID%%.*}"
          # macOS ships bash 3.2, which has no `mapfile`; read the file a line at a time instead.
          versions=()
          while IFS= read -r line; do versions+=("$line"); done < "$RUNNER_TEMP/versions.txt"
          auth=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
            -authenticationKeyID "$ASC_KEY_ID"
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          )
          xcodebuild archive \
            -project mobile/ios/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$team" \
            CODE_SIGN_STYLE=Automatic \
            "${versions[@]}" \
            "${auth[@]}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$team</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            "${auth[@]}"
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-app
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
