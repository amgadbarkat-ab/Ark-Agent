# Deploy Ark to Azure. By hand only.
#
# Builds the two images inside Azure's own registry (so nothing is pushed from here and no registry
# password exists), then upgrades the Helm release on the cluster, and fails the run if the release
# does not come up healthy. A failed upgrade rolls itself back (`--atomic`).
#
# NOT the CopilotKit release workflows next to it (publish-release.yml, release.yml), which name
# CopilotKit's registry and must not be run from this repository.
#
# What it needs, set once on the repository (Settings > Variables, none of it secret):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  an app registration that trusts this
#                                                             repository's `dev` and `prod` environments
#                                                             by federated credential (infra/azure/README.md)
#   AZURE_RESOURCE_GROUP                                      e.g. rg-ark-prod (per environment)
# and, for `prod`, a GitHub environment with required reviewers, so nothing reaches customers unseen.
#
# There is no password anywhere in this file or in the repository: the run proves who it is with a
# short-lived token GitHub issues for it, and Azure exchanges that for access.

name: Deploy Ark to Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  # To ask GitHub for the token Azure trusts.
  id-token: write

concurrency:
  group: ark-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      NAME: ark-${{ inputs.environment }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Azure CLI is on the runner. Logging in with the run's own token rather than through a
      # third-party action keeps one fewer thing in the supply chain between this and production.
      - name: Sign in to Azure
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::${token}"
          az login --service-principal --username "$CLIENT_ID" --tenant "$TENANT_ID" \
            --federated-token "$token" --output none
          az account set --subscription "$SUBSCRIPTION_ID"

      - name: Find what the infrastructure created
        run: |
          set -euo pipefail
          out() { az deployment group show -g "$RESOURCE_GROUP" -n main --query "properties.outputs.$1.value" -o tsv; }
          {
            echo "REGISTRY=$(out registryName)"
            echo "REGISTRY_SERVER=$(out registryLoginServer)"
            echo "CLUSTER=$(out clusterName)"
          } >> "$GITHUB_ENV"

      # `az acr build` runs in Azure: the source goes up, the image is built and stored there, and
      # nothing is pushed from this runner.
      - name: Build the application image
        run: az acr build --registry "$REGISTRY" --image "ark:${GITHUB_SHA}" --file Dockerfile .
      - name: Build the hub image
        run: az acr build --registry "$REGISTRY" --image "ark-hub:${GITHUB_SHA}" --file hub/Dockerfile .

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      # No static cluster credential exists (local accounts are off). This signs in to the cluster as
      # the run's own identity, which holds the cluster-admin role by group.
      - name: Connect to the cluster
        run: |
          set -euo pipefail
          sudo az aks install-cli >/dev/null
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$CLUSTER" --overwrite-existing --only-show-errors
          kubelogin convert-kubeconfig -l azurecli

      - name: Chart dependencies
        run: helm dependency build charts/openbot

      - name: Upgrade
        run: |
          set -euo pipefail
          helm upgrade --install ark charts/openbot \
            --namespace ark --create-namespace \
            --values infra/azure/values-azure.yaml \
            --set "image.repository=${REGISTRY_SERVER}/ark" --set "image.tag=${GITHUB_SHA}" \
            --set "hub.image.repository=${REGISTRY_SERVER}/ark-hub" --set "hub.image.tag=${GITHUB_SHA}" \
            --atomic --wait --timeout 15m

      - name: Is it answering
        run: |
          set -euo pipefail
          host="$(helm get values ark -n ark -o json | jq -r .config.publicUrl)"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "${host}/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::${host}/health did not answer after the upgrade."
          exit 1
