name: Android app

# The Android app is a manifest and a library (a Trusted Web Activity, docs/ark/19-mobile.md), so
# there is little to break, and what can break is the build and the names it is given.
#
#  - Every change to it builds a debug app against made-up names and runs Android lint. Holds no
#    secret and answers "does this still build".
#  - A person starting it by hand builds the signed bundle for Google Play from the deployment's own
#    names and the upload key. The bundle is kept as a build artifact; uploading it to Google Play is
#    the owner's, in the Play Console (or with their own service account), and is not done here.
#
# Nothing here has been run on GitHub: it was written beside a build that was run by hand with the
# same commands.
on:
  pull_request:
    paths:
      - "mobile/android/**"
      - "mobile/scripts/**"
      - "app/public/manifest.webmanifest"
      - "app/public/icons/icon-192.png"
      - ".github/workflows/mobile-android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "mobile/scripts/**"
      - "app/public/manifest.webmanifest"
      - "app/public/icons/icon-192.png"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Version code for this upload. Must be higher than every one already in Google Play. Empty uses the run number."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Made-up names, on purpose: this proves the project builds, and must never be mistaken for the app.
  check:
    name: build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The same checks the deployment's names go through before a release.
      - run: bun test mobile
      - name: Prepare against made-up names
        env:
          ARK_ANDROID_APP_ID: test.example.ark
          ARK_APP_URL: https://ark.example
          ARK_APP_NAME: Ark Test
          ARK_ANDROID_VERSION_CODE: "1"
        run: bun mobile/scripts/prepare-android.ts
      - name: Use the runner's Java 21 and Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          # The runner image carries the SDK but not always the newest platform. Installing a platform
          # means accepting Google's Android SDK licence; the owner of this repository is the party
          # accepting it by running this job.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build the debug app and run Android lint
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug lintRelease

  # By hand only: it holds the upload key.
  release:
    name: signed bundle for Google Play
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Anyone who can edit this file can read what the job can read, so the settings and the key are
    # only given to a run started from the default branch.
    environment: mobile-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prepare from the deployment's own names
        env:
          # Repository (or environment) variables, set by the owner: see mobile/README.md.
          ARK_ANDROID_APP_ID: ${{ vars.ARK_ANDROID_APP_ID }}
          ARK_APP_URL: ${{ vars.ARK_APP_URL }}
          ARK_APP_NAME: ${{ vars.ARK_APP_NAME }}
          ARK_ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: bun mobile/scripts/prepare-android.ts
      - name: Use the runner's Java 21 and Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Put the upload key where Gradle reads it
        env:
          KEYSTORE_BASE64: ${{ secrets.ARK_ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          echo "ARK_ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build the signed bundle
        working-directory: mobile/android
        env:
          ARK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ARK_ANDROID_KEYSTORE_PASSWORD }}
          ARK_ANDROID_KEY_ALIAS: ${{ secrets.ARK_ANDROID_KEY_ALIAS }}
          ARK_ANDROID_KEY_PASSWORD: ${{ secrets.ARK_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lintRelease bundleRelease
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-bundle
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
