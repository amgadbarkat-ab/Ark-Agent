name: Own browser

# Device control drives the customer's own Chrome or Edge (desk #27). Every other test of it stands
# Playwright's Chromium in for that browser on Linux, which proves nothing about the two places it
# actually runs: an installed Edge or Chrome on Windows and on macOS, started by agent-computer under
# Bun over a pipe, with its own sandbox and a profile folder on that platform's paths. GitHub's
# Windows and macOS machines have both browsers installed, so this runs the desktop's own path there.
on:
  pull_request:
    paths:
      - "agent-computer/**"
      - "desktop/src-tauri/src/own_browser.rs"
      - ".github/workflows/own-browser.yml"
  push:
    branches: [main]
    paths:
      - "agent-computer/**"
      - "desktop/src-tauri/src/own_browser.rs"
      - ".github/workflows/own-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: own-browser-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser:
    name: own browser (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: windows edge
            runner: windows-latest
            browser: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
          - name: windows chrome
            runner: windows-latest
            browser: C:\Program Files\Google\Chrome\Application\chrome.exe
          - name: macos chrome
            runner: macos-latest
            browser: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
          - name: macos edge
            runner: macos-latest
            browser: /Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Said out loud rather than skipped: a runner image without the browser would otherwise pass
      # every test by skipping it.
      - name: The browser is installed
        shell: bash
        env:
          BROWSER: ${{ matrix.target.browser }}
        run: |
          test -f "$BROWSER" || { echo "::error::$BROWSER is not on this runner image"; exit 1; }
      - run: bun install --frozen-lockfile
        working-directory: agent-computer
      # Launched directly, as the desktop launches it: public pages only, so the product path runs
      # unchanged. Then the proxy script against the same browser, redirect hops included.
      - name: Desktop path on the installed browser
        shell: bash
        working-directory: agent-computer
        env:
          OPENBOT_OWN_BROWSER_PLATFORM: "1"
          OPENBOT_OWN_BROWSER: "1"
          OWN_BROWSER_STAND_IN: ${{ matrix.target.browser }}
        run: bun test tests/own-browser-platform.test.ts tests/private-network.test.ts
