# Is anything we ship vulnerable, and has anybody looked?
#
# `bun audit` reports every known advisory and always has some, so by itself it cannot be a gate.
# scripts/audit-check.ts fails only on a HIGH or CRITICAL advisory that is not in
# security/audit-allowlist.json, or whose entry has passed its expiry date. An entry there is a
# decision with a reason and a date (docs/ark/15-security-review.md, O4), so the list cannot become a
# way of not looking.
#
# Runs weekly, because new advisories appear while the code stands still, and on any change to the
# dependency files or the list. A failure on the schedule is the alert: GitHub tells the people
# watching the repository.

name: Dependency audit

on:
  schedule:
    # Monday, early, so a new advisory is the first thing the week finds.
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - package.json
      - bun.lock
      - "*/package.json"
      - security/audit-allowlist.json
      - scripts/audit-check.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: no unreviewed high or critical advisory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # `--strict` on the schedule: an allow-list entry that nothing matches any more is a decision
      # about something that is gone, and is removed rather than left to pile up.
      - name: Audit
        run: bun scripts/audit-check.ts --strict
