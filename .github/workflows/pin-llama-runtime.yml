# Records which llama.cpp release the desktop app's managed local model may download, and the SHA-256
# of every file in it (docs/ark/22-starter-model.md, scripts/pin-llama-runtime.ts).
#
# It runs on a hosted runner because that is a machine with a clear route to llama.cpp's release page.
# It only READS: it downloads the files the desktop would use, hashes them, and hands the result back as
# the job log and an artifact. A person reviews that file and commits it as
# `desktop/src-tauri/llama-runtime.json`, so a build is never pinned by a workflow that could be
# talked into pinning a different one. No credential is left on the runner and none can write.

name: Pin llama.cpp runtime

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "llama.cpp build, like b9628, or latest"
        required: false
        default: latest
  push:
    paths:
      - scripts/pin-llama-runtime.ts
      - .github/workflows/pin-llama-runtime.yml

permissions:
  contents: read

concurrency:
  group: pin-llama-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    name: hash the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Pin the release
        env:
          TAG: ${{ inputs.tag || 'latest' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "----- llama-runtime.json begins -----"
          bun scripts/pin-llama-runtime.ts --tag "$TAG" --out llama-runtime.json
          echo "----- llama-runtime.json ends -----"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llama-runtime
          path: llama-runtime.json
          if-no-files-found: error
          retention-days: 30
