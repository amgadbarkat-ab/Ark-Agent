# Values for the External Secrets operator's own Helm chart:
#
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     -n external-secrets --create-namespace -f external-secrets-values.yaml \
#     --set serviceAccount.annotations."azure\.workload\.identity/client-id"=<secretsIdentityClientId>
#
# The client id is the `secretsIdentityClientId` output of main.bicep. The operator then reads the vault
# as that identity, with no password: the pod's token is exchanged for an Azure one at the moment of use.
serviceAccount:
  name: external-secrets
podLabels:
  azure.workload.identity/use: "true"
