# Tells External Secrets where the vault is. Apply once, after the operator is installed:
#
#   KEY_VAULT_URI=$(az deployment group show -g rg-ark-prod -n main --query properties.outputs.keyVaultUri.value -o tsv) \
#     envsubst < cluster-secret-store.yaml | kubectl apply -f -
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: ${KEY_VAULT_URI}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
