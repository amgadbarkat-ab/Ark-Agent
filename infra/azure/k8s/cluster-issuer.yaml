# Free certificates from Let's Encrypt, renewed by cert-manager, for the two names the chart serves.
#
#   helm repo add jetstack https://charts.jetstack.io
#   helm install cert-manager jetstack/cert-manager -n cert-manager --create-namespace --set crds.enabled=true
#   kubectl apply -f cluster-issuer.yaml
#
# Replace the address with a mailbox somebody reads: Let's Encrypt writes there before a certificate
# runs out, and when it cannot renew one.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@example.com
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: webapprouting.kubernetes.azure.com
